<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.css">
    <script src="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.js"></script>
</head>

<body>
    <div style="margin-top: 50px;" class=" ui container">
    <h1 class="ui center aligned header"> Todo App</h1>

    <form class=" ui form" action="/add" method="post">
        <div>
            <label> Todo</label>
            <input class="ui input" type="text" name="title" placeholder="enter todo">
            <button  class="ui green button" type="submit">add</button>
        </div>
    </form>


    {% for todo in todo_list %}
    <div class="ui segment">
        <p class="ui header">{{todo.id}} | {{todo.title}}</p>

        <a class="ui red button"href="/delete/{{todo.id}}">Delete</a>
    </div>
    {% endfor %}
    <a class="ui red button"href="/deleteall">Delete all</a>
    
</div>
</body>

</html>
